  <style>
    :root {
      --primary: #0D1B2A;
      --secondary: #1B263B;
      --card: #1E2A3A;
      --purple: #7B2CBF;
      --purple-light: #9D4EDD;
      --blue: #3A86FF;
      --text: #E0E1DD;
      --text-sec: #ADB5BD;
      --success: #2EC4B6;
      --error: #E63946;
      --warning: #FFB703;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(160deg, #0D1B2A 0%, #1B263B 50%, #2D1B4E 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: 30px;
    }

    /* Header */
    .header {
      background: linear-gradient(90deg, #1B263B, #2D1B4E);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header .back-btn {
      background: rgba(123,44,191,0.2);
      border: none;
      color: var(--purple-light);
      width: 38px; height: 38px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
    }

    /* Home */
    .home-hero {
      text-align: center;
      padding: 40px 20px 30px;
    }
    .logo-circle {
      width: 90px; height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      box-shadow: 0 0 30px rgba(123,44,191,0.45);
    }
    .home-hero h2 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .home-hero p {
      color: var(--text-sec);
      font-size: 13px;
    }

    .chapter-card, .goftar-card, .action-card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      margin: 0 16px 14px;
      border: 1.5px solid rgba(123,44,191,0.25);
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .chapter-card:hover, .goftar-card:hover, .action-card:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
      box-shadow: 0 8px 25px rgba(123,44,191,0.2);
    }
    .chapter-num, .goftar-num {
      width: 50px; height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800;
      flex-shrink: 0;
    }
    .card-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .card-info span { font-size: 12px; color: var(--text-sec); }
    .card-arrow { margin-right: auto; color: var(--purple-light); font-size: 18px; }

    .hard-exam-btn {
      background: linear-gradient(135deg, rgba(123,44,191,0.85), rgba(58,134,255,0.7));
      border: none;
      border-radius: 18px;
      padding: 18px;
      margin: 20px 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(123,44,191,0.35);
    }
    .hard-exam-btn .icon { font-size: 28px; }
    .hard-exam-btn h3 { font-size: 15px; font-weight: 700; }
    .hard-exam-btn span { font-size: 12px; opacity: 0.85; }

    /* Progress steps */
    .steps {
      display: flex;
      justify-content: center;
      gap: 0;
      padding: 20px 16px 10px;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step-circle {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid rgba(173,181,189,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      z-index: 2;
    }
    .step.active .step-circle {
      background: var(--purple);
      border-color: var(--purple);
      color: white;
    }
    .step.done .step-circle {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .step-label {
      font-size: 11px;
      margin-top: 6px;
      color: var(--text-sec);
    }
    .step.active .step-label { color: var(--purple-light); font-weight: 600; }
    .step-line {
      position: absolute;
      top: 17px;
      right: 50%;
      width: 100%;
      height: 2px;
      background: var(--card);
      z-index: 1;
    }
    .step.done .step-line { background: var(--success); }

    .content-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin: 12px 16px;
      border: 1px solid rgba(123,44,191,0.2);
    }

      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .content-card .card-title.blue { color: var(--blue); }
    .content-card .card-title.yellow { color: var(--warning); }
    .content-card .body-text {
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    /* Image placeholder */
    .image-box {
      background: linear-gradient(135deg, rgba(123,44,191,0.25), rgba(58,134,255,0.15));
      border-radius: 14px;
      height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-sec);
      font-size: 13px;
      gap: 10px;
    }
    .image-box .big-icon { font-size: 50px; opacity: 0.7; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      padding: 16px;
      position: sticky;
      bottom: 0;
      background: linear-gradient(transparent, #0D1B2A 30%);
      padding-top: 30px;

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;

    .btn-primary {
      background: var(--purple);
      color: white;
      flex: 2;

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--purple);
      color: var(--purple-light);
    }

    /* Quiz */
    .question-box {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin: 0 16px 16px;
      border: 1.5px solid rgba(123,44,191,0.3);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 500;
    }
    .option {
      background: var(--card);
      border-radius: 14px;
      padding: 13px 14px;
      margin: 0 16px 10px;
      border: 1.5px solid rgba(123,44,191,0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .option.selected {
      border-color: var(--purple);
      background: rgba(123,44,191,0.2);
    }
    .option-label {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--secondary);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .option.selected .option-label {
      background: var(--purple);
    }
    .progress-bar {
      height: 5px;
      background: var(--card);
    }
    .progress-fill {
      height: 100%;
      background: var(--purple);
      transition: width 0.3s;
    }
    .quiz-meta {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-sec);
    }
    .badge-hard {
      background: rgba(230,57,70,0.2);
      color: var(--error);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Result */
    .result-hero {
      margin: 20px 16px;
      padding: 28px 20px;
      border-radius: 20px;
      text-align: center;
    }
    .result-hero.good {
      background: linear-gradient(135deg, rgba(46,196,182,0.25), rgba(58,134,255,0.15));
      border: 1.5px solid var(--success);
    }
    .result-hero.bad {
      background: linear-gradient(135deg, rgba(230,57,70,0.25), rgba(123,44,191,0.15));
      border: 1.5px solid var(--error);
    }
    .result-hero .score {
      font-size: 36px;
      font-weight: 800;
      margin: 10px 0 4px;
    }
    .analysis-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin: 0 16px 12px;
    }
    .analysis-card.correct { border: 1px solid rgba(46,196,182,0.5); }
    .analysis-card.wrong { border: 1px solid rgba(230,57,70,0.5); }
    .analysis-card .q-num {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .analysis-card .explanation {
      margin-top: 8px;
      font-size: 13px;
      color: var(--purple-light);
      line-height: 1.6;
    }

    .hidden { display: none !important; }
    .footer-note {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: rgba(173,181,189,0.5);
    }
  </style>
</head>

    let state = {

    // ===================== RENDER =====================
    function render() {
      const app = document.getElementById('app');
      if (state.page === 'home') app.innerHTML = renderHome();
      else if (state.page === 'chapter') app.innerHTML = renderChapter();
      else if (state.page === 'goftar') app.innerHTML = renderGoftar();
      else if (state.page === 'quiz') app.innerHTML = renderQuiz();
      else if (state.page === 'result') app.innerHTML = renderResult();
    }

    function renderHome() {
      return `
        <div class="home-hero">
          <div class="logo-circle">🧬</div>
          <h2>زیست خیلی آسان</h2>
          <p>زیست دوازدهم به روش دکتر علی تهرانی و رفضا</p>
        </div>
        ${chapters.map((ch, i) => `
          <div class="chapter-card" onclick="openChapter(${i})">
            <div class="chapter-num">${i + 1}</div>
            <div class="card-info">
              <h3>${ch.title}</h3>
              <span>${ch.goftars.length} گفتار + آزمون جامع</span>
            </div>
            <div class="card-arrow">‹</div>
          </div>
        `).join('')}
        <div class="footer-note">نسخه وب ۱.۰ • مخصوص کنکور</div>
      `;
    }

    function renderChapter() {
      const ch = chapters[state.chapterIndex];
      return `
        <div class="header">
          <button class="back-btn" onclick="goHome()">›</button>
          <h1>${ch.title}</h1>
        </div>
        <div style="padding:16px 16px 8px;font-size:14px;font-weight:700;color:var(--purple-light)">گفتارهای فصل</div>

          <div class="goftar-card" onclick="openGoftar(${i})">
            <div class="goftar-num" style="width:42px;height:42px;font-size:16px">${i + 1}</div>
            <div class="card-info">
              <h3>${g.title}</h3>
            </div>
            <div class="card-arrow">▶</div>
          </div>
        `).join('')}
        <button class="hard-exam-btn" onclick="startHardExam()">
          <div class="icon">🏆</div>
          <div>
            <h3>آزمون جامع سطح سخت</h3>
            <span>بعد از تمام کردن همه گفتارها پیشنهاد می‌شود</span>
          </div>
        </button>

    function renderGoftar() {
      const g = chapters[state.chapterIndex].goftars[state.goftarIndex];

      return `
        <div class="header">
          <button class="back-btn" onclick="backToChapter()">›</button>
          <h1>${g.title}</h1>

            <div class="step ${i === state.step ? 'active' : ''} ${i < state.step ? 'done' : ''}">
              ${i > 0 ? '<div class="step-line"></div>' : ''}
              <div class="step-circle">${i < state.step ? '✓' : i + 1}</div>
              <div class="step-label">${s}</div>
            </div>
          `).join('')}
        </div>
        ${state.step === 0 ? `

          </div>

          <button class="btn btn-primary" onclick="nextStep()">
            ${state.step === 0 ? 'بعدی: تصویر تحلیلی' : 'شروع آزمون'}
          </button>
        </div>
      `;
    }

    function renderQuiz() {
      const qs = state.questions;
      const q = qs[state.quizIndex];
      const labels = ['الف', 'ب', 'ج', 'د'];
      const selected = state.answers[state.quizIndex];
      return `
        <div class="header">
          <button class="back-btn" onclick="backFromQuiz()">›</button>
          <h1>${state.isHard ? 'آزمون جامع سخت' : 'آزمون گفتار'}</h1>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${((state.quizIndex + 1) / qs.length) * 100}%"></div>
        </div>
        <div class="quiz-meta">
          <span>سوال ${state.quizIndex + 1} از ${qs.length}</span>
          ${state.isHard ? '<span class="badge-hard">سطح سخت</span>' : ''}
        </div>
        <div class="question-box">${q.q}</div>
        ${q.options.map((opt, i) => `
          <div class="option ${selected === i ? 'selected' : ''}" onclick="selectAnswer(${i})">
            <div class="option-label">${labels[i]}</div>
            <div>${opt}</div>
          </div>
        `).join('')}
        <div class="btn-row">
          ${state.quizIndex > 0 ? `<button class="btn btn-outline" onclick="prevQuestion()">قبلی</button>` : ''}
          <button class="btn btn-primary" ${selected === undefined || selected === null ? 'disabled' : ''} onclick="nextQuestion()">
            ${state.quizIndex === qs.length - 1 ? 'مشاهده نتیجه' : 'سوال بعدی'}
          </button>
        </div>
      `;
    }

    function renderResult() {
      const qs = state.questions;
      let score = 0;
      qs.forEach((q, i) => { if (state.answers[i] === q.correct) score++; });
      const percent = Math.round(score / qs.length * 100);
      const good = percent >= 70;
      const labels = ['الف', 'ب', 'ج', 'د'];
      return `
        <div class="header">
          <h1>نتیجه و تحلیل آزمون</h1>
        </div>
        <div class="result-hero ${good ? 'good' : 'bad'}">

          <div class="score">${score} از ${qs.length}</div>
          <div style="font-size:18px;color:var(--text-sec)">${percent}٪</div>
          <div style="margin-top:8px;font-size:14px">${good ? 'عالی بودی! ادامه بده' : 'نیاز به مرور بیشتر داری، ناامید نشو!'}</div>
        </div>
        ${qs.map((q, i) => {
          const user = state.answers[i];
          const correct = user === q.correct;
          return `
            <div class="analysis-card ${correct ? 'correct' : 'wrong'}">
              <div class="q-num">
                <span>${correct ? '✅' : '❌'}</span>
                <span>سوال ${i + 1}</span>
              </div>
              <div style="font-size:13px;color:var(--text-sec);margin-bottom:8px;line-height:1.6">${q.q}</div>
              <div style="font-size:13px;color:var(--success);font-weight:700">پاسخ صحیح: ${labels[q.correct]}</div>
              ${!correct && user !== undefined ? `<div style="font-size:13px;color:var(--error)">پاسخ شما: ${labels[user]}</div>` : ''}
              <div class="explanation">${q.exp}</div>
            </div>
          `;
        }).join('')}
        <div class="btn-row">
          <button class="btn btn-primary" onclick="backToChapter()">بازگشت به فصل</button>
        </div>
      `;
    }

    // ===================== ACTIONS =====================
    function openChapter(i) {
      state.chapterIndex = i;
      state.page = 'chapter';
      render();
      window.scrollTo(0, 0);
    }
    function goHome() {
      state.page = 'home';
      render();
      window.scrollTo(0, 0);
    }
    function openGoftar(i) {
      state.goftarIndex = i;
      state.step = 0;
      state.page = 'goftar';
      render();
      window.scrollTo(0, 0);
    }
    function backToChapter() {
      state.page = 'chapter';
      render();
      window.scrollTo(0, 0);
    }
    function nextStep() {
      if (state.step === 0) {
        state.step = 1;
        render();
        window.scrollTo(0, 0);
      } else {
        // start quiz
        const g = chapters[state.chapterIndex].goftars[state.goftarIndex];
        state.questions = g.questions;
        state.answers = new Array(g.questions.length).fill(null);
        state.quizIndex = 0;
        state.isHard = false;
        state.page = 'quiz';
        render();
        window.scrollTo(0, 0);
      }
    }
    function prevStep() {
      state.step = 0;
      render();
      window.scrollTo(0, 0);
    }
    function startHardExam() {
      const ch = chapters[state.chapterIndex];
      state.questions = ch.hardExam;
      state.answers = new Array(ch.hardExam.length).fill(null);
      state.quizIndex = 0;
      state.isHard = true;
      state.page = 'quiz';
      render();
      window.scrollTo(0, 0);
    }
    function selectAnswer(i) {
      state.answers[state.quizIndex] = i;
      render();
    }
    function nextQuestion() {
      if (state.quizIndex < state.questions.length - 1) {
        state.quizIndex++;
        render();
        window.scrollTo(0, 0);
      } else {
        state.page = 'result';
        render();
        window.scrollTo(0, 0);
      }
    }
    function prevQuestion() {
      if (state.quizIndex > 0) {
        state.quizIndex--;
        render();
        window.scrollTo(0, 0);
      }
    }
    function backFromQuiz() {
      if (state.isHard) backToChapter();
      else {
        state.page = 'goftar';
        state.step = 1;
        render();
      }
    }

    // Init
    render();

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
